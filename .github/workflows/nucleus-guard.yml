name: Nucleus Guard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Nucleus Guard
        env:
          NUCLEUS_GUARD_URL: ${{ secrets.NUCLEUS_GUARD_URL }}
          NUCLEUS_GUARD_TOKEN: ${{ secrets.NUCLEUS_GUARD_TOKEN }}
        run: |
          python3 /home/vboxuser/nucleus-guard/scripts/guard_ci.py review \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --repo "temp_te" \
            --cwd "$GITHUB_WORKSPACE"
