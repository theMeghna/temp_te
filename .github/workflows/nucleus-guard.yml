name: Nucleus Guard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nucleus-guard/verify-action@v1
        with:
          guard-url: ${{ secrets.NUCLEUS_GUARD_URL }}
          guard-token: ${{ secrets.NUCLEUS_GUARD_TOKEN }}
          repo-slug: temp-te
